<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Yuga Ultimate Rhythm</title>
<style>
body {
  margin: 0;
  background: #000;
  overflow: hidden;
  color: #0ff;
  font-family: sans-serif;
}

.lane {
  position: absolute;
  bottom: 0;
  width: 25%;
  height: 100%;
  border: 1px solid rgba(0,255,255,0.2);
}

.lane:nth-child(1){ left:0;}
.lane:nth-child(2){ left:25%;}
.lane:nth-child(3){ left:50%;}
.lane:nth-child(4){ left:75%;}

.hit-line {
  position: absolute;
  bottom: 100px;
  width: 100%;
  height: 4px;
  background: #0ff;
}

.note {
  position: absolute;
  width: 80%;
  left: 10%;
  height: 20px;
  background: #0ff;
  border-radius: 10px;
}

.long {
  background: linear-gradient(#0ff, #004);
}

.slide {
  background: linear-gradient(90deg, #f0f, #0ff);
}
</style>
</head>
<body>

<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="hit-line"></div>

<script>
const lanes = document.querySelectorAll('.lane');
let notes = [];
let speed = 5;
let holding = [false,false,false,false];

// ===== ノーツ生成 =====
setInterval(() => {
  let r = Math.random();
  if(r < 0.5){
    spawnNote(Math.floor(Math.random()*4), "tap");
  } else if(r < 0.75){
    spawnNote(Math.floor(Math.random()*4), "long");
  } else {
    spawnSlide();
  }
}, 700);

// ===== 通常・ロング =====
function spawnNote(laneIndex, type){
  const lane = lanes[laneIndex];
  const note = document.createElement('div');
  note.className = 'note';

  if(type === "long"){
    note.classList.add("long");
    note.style.height = "120px";
  }

  note.style.top = "0px";
  lane.appendChild(note);

  notes.push({
    el: note,
    lane: laneIndex,
    type: type,
    y: 0,
    hold: false
  });
}

// ===== スライド =====
function spawnSlide(){
  let start = Math.floor(Math.random()*4);
  let end = Math.floor(Math.random()*4);

  const note = document.createElement('div');
  note.className = 'note slide';
  note.style.top = "0px";
  document.body.appendChild(note);

  notes.push({
    el: note,
    lane: start,
    targetLane: end,
    type: "slide",
    y: 0
  });
}

// ===== 更新 =====
function update(){
  notes.forEach((n,i)=>{
    n.y += speed;

    if(n.type === "slide"){
      let x = (n.lane + (n.targetLane - n.lane)*(n.y/500)) * (window.innerWidth/4);
      n.el.style.left = x + "px";
    }

    n.el.style.top = n.y + "px";

    if(n.y > window.innerHeight){
      n.el.remove();
      notes.splice(i,1);
    }
  });

  requestAnimationFrame(update);
}
update();

// ===== 判定 =====
function hit(lane){
  let hitY = window.innerHeight - 120;

  notes.forEach((n,i)=>{
    if(n.type === "tap" && n.lane === lane){
      if(Math.abs(n.y - hitY) < 50){
        n.el.remove();
        notes.splice(i,1);
      }
    }

    if(n.type === "long" && n.lane === lane){
      if(Math.abs(n.y - hitY) < 50){
        n.hold = true;
      }
      if(n.hold && !holding[lane]){
        n.el.remove();
        notes.splice(i,1);
      }
    }

    if(n.type === "slide"){
      if(Math.abs(n.y - hitY) < 50){
        n.el.remove();
        notes.splice(i,1);
      }
    }
  });
}

// ===== PC操作 =====
document.addEventListener('keydown', e=>{
  if(e.key==='d'){ hit(0); holding[0]=true;}
  if(e.key==='f'){ hit(1); holding[1]=true;}
  if(e.key==='j'){ hit(2); holding[2]=true;}
  if(e.key==='k'){ hit(3); holding[3]=true;}
});

document.addEventListener('keyup', e=>{
  if(e.key==='d') holding[0]=false;
  if(e.key==='f') holding[1]=false;
  if(e.key==='j') holding[2]=false;
  if(e.key==='k') holding[3]=false;
});

// ===== スマホ対応（重要🔥）=====
lanes.forEach((lane, index) => {

  lane.addEventListener('touchstart', (e) => {
    e.preventDefault();
    holding[index] = true;
    hit(index);
  });

  lane.addEventListener('touchend', () => {
    holding[index] = false;
  });

  // PCクリックも対応
  lane.addEventListener('mousedown', () => {
    holding[index] = true;
    hit(index);
  });

  lane.addEventListener('mouseup', () => {
    holding[index] = false;
  });

});
</script>

</body>
</html>
