<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Yuga - Cool Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: #0a0a0a;
      color: white;
      overflow-x: hidden;
    }

    header {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #000000, #111111);
    }

    h1 {
      font-size: 4rem;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00f0ff; }
      to { text-shadow: 0 0 30px #00f0ff; }
    }

    p {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.7;
    }

    section {
      padding: 100px 20px;
      text-align: center;
    }

    .card {
      margin: 40px auto;
      padding: 30px;
      max-width: 500px;
      border: 1px solid #00f0ff;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00f0ff;
    }

    .fade {
      opacity: 0;
      transform: translateY(50px);
      transition: 1s;
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<header>
  <h1>YUGA</h1>
  <p>Cool. Simple. Different.</p>
</header>

<section class="fade">
  <h2>About Me</h2>
  <div class="card">
    <p>名前：ゆうが</p>
    <p>スタイル：クールでシンプル</p>
    <p>目標：誰よりもかっこよく</p>
  </div>
</section>

<section class="fade">
  <h2>My Vibe</h2>
  <div class="card">
    <p>無駄を削ぎ落としたデザイン</p>
    <p>静かだけど存在感</p>
    <p>シンプル is 最強</p>
  </div>
</section>

<footer>
  © 2026 Yuga
</footer>

<script>
  const fades = document.querySelectorAll('.fade');

  window.addEventListener('scroll', () => {
    fades.forEach(fade => {
      const rect = fade.getBoundingClientRect().top;
      if (rect < window.innerHeight - 100) {
        fade.classList.add('show');
      }
    });
  });
</script>

</body>
</html>
